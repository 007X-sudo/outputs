name: Deploy Website to GitHub Pages

# 触发条件：
#   1. 推送到 main 分支（任何文件变动都部署，避免漏掉 assets/ 等目录的更新）
#   2. 也可以在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 允许工作流向 GitHub Pages 发布内容
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送自动取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
